# Override para buildar as imagens localmente em vez de baixar do registry.
# Uso: docker compose -f docker-compose.yml -f docker-compose.build.yml up -d --build
services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: iot-platform-backend:local

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: iot-platform-frontend:local
